<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEOWULF Instrument</title><link rel="stylesheet" href="studio.css"></head><body>
<main class="machine">
  <header class="brand"><div class="wolf">N<span>W</span></div><div><b>NEOWULF</b><small>FROM HELL · INSTRUMENT SERIES</small></div><h1 id="modelTitle"></h1><span class="power" title="Audio aktivieren"></span></header>
  <section class="topline">
    <div class="transport"><button id="power">AUDIO ON</button><button id="play" title="Sequencer starten (Leertaste)">▶ PLAY</button><button id="stop">■ STOP</button><button id="record">● REC</button><button id="link">LINK</button></div>
    <div class="lcd"><span id="patternName">HELLFIRE 01</span><strong id="readout">128.0 BPM</strong><span id="status">BEREIT · AUDIO ON ZUM SPIELEN</span></div>
    <div class="global"><label>TEMPO<input id="tempo" type="number" min="40" max="300" step=".1" value="128"></label><label>SWING<input id="swing" type="range" min="0" max=".45" step=".005" value="0"></label><label>MASTER<input id="master" type="range" min="0" max="1" step=".01" value=".55"></label></div>
  </section>
  <section class="bodygrid">
    <div class="partpanel"><div class="sectiontitle">PART SELECT <span id="partName"></span></div><div id="parts" class="parts"></div><div class="parttools"><button id="mute">MUTE</button><button id="solo">SOLO</button><button id="keyboard">KEYBOARD</button><button id="arp">ARP</button></div><canvas id="scope" aria-label="Audio-Wellenform"></canvas></div>
    <div class="soundpanel"><div class="sectiontitle">SOUND ENGINE <span id="engineKind"></span></div><div class="oscrow"><label>OSCILLATOR / DRUM<select id="wave"></select></label><label>PAD NOTE<input id="note" type="number" min="0" max="127" value="48"></label><button id="sampleImport">SAMPLE LADEN</button></div><div id="knobs" class="knobs"></div><div id="sampleControls" class="samplecontrols"><label>START<input id="sampleStart" type="range" min="0" max=".99" step=".001"></label><label>END<input id="sampleEnd" type="range" min=".01" max="1" step=".001"></label><button id="reverse">REVERSE</button><button id="loop">LOOP</button><span id="sampleName">Eigene synthetische Werksklänge</span></div></div>
  </section>
  <section class="sequencer"><div class="seqhead"><div class="sectiontitle">STEP SEQUENCER <span id="stepReadout">01 / 16</span></div><label>LÄNGE<select id="length"></select></label><label>SEITE<select id="page"></select></label><button id="motion">MOTION REC</button><button id="clear">PART LEEREN</button><button id="copy">KOPIEREN</button><button id="paste">EINFÜGEN</button></div><div id="steps" class="steps"></div></section>
  <section class="pads"><div class="sectiontitle">PERFORMANCE PADS <span>Q W E R · A S D F · Z X C V · T Y G H</span></div><div id="pads" class="padgrid"></div></section>
  <footer><div class="patternbar"><label>BANK<select id="bank"></select></label><div id="patterns"></div><button id="rename">NAME</button><button id="chain">SONG CHAIN</button></div><div class="files"><button id="save">PROJEKT SPEICHERN</button><button id="load">PROJEKT LADEN</button><button id="wav">WAV EXPORT</button><button id="midi">MIDI IN</button></div></footer>
  <input id="sampleFile" hidden type="file" accept="audio/*"><input id="projectFile" hidden type="file" accept="application/json,.json"><div id="toast" role="status"></div>
</main><dialog id="edit"><form method="dialog"><h2>STEP EDITOR</h2><label>NOTE<input id="editNote" type="number" min="0" max="127"></label><label>VELOCITY<input id="editVelocity" type="range" min="0" max="1" step=".01"></label><label>GATE<input id="editGate" type="range" min=".05" max="8" step=".05"></label><p>Umschalt + Klick öffnet diesen Editor.</p><button value="cancel">ABBRECHEN</button><button id="editSave" value="save">SPEICHERN</button></form></dialog>
<script src="instrument-app.js"></script></body></html>
