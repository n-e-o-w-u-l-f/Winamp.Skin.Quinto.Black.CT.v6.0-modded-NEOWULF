name: Validate NEOWULF

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository without marketplace actions
        shell: bash
        run: |
          git clone --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" repo
          cd repo
          git rev-parse HEAD

      - name: Validate Python and display pipeline
        shell: bash
        working-directory: repo
        run: |
          python3 -m pip install --disable-pip-version-check --user pillow
          python3 -m py_compile tools/apply_neowulf_v6_display.py
          python3 -m py_compile tools/validate_neowulf_v6_display.py
          python3 -m py_compile tests/test_display_pipeline.py
          python3 tests/test_display_pipeline.py

      - name: Verify committed MAKI binaries
        shell: bash
        working-directory: repo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files=sorted(Path('skin/SCRIPTS').glob('*.maki'))
          assert files, 'no MAKI binaries found'
          bad=[str(p) for p in files if not p.read_bytes().startswith(b'FG')]
          assert not bad, 'invalid MAKI signature: ' + ', '.join(bad)
          required={'neowulf-vis-profile.maki','neowulf-vrp-rotation.maki','neowulf-speaker.maki','neowulf-vu-40.maki'}
          have={p.name for p in files}
          missing=required-have
          assert not missing, 'missing required MAKI: ' + ', '.join(sorted(missing))
          print(f'validated {len(files)} MAKI binaries')
          PY
